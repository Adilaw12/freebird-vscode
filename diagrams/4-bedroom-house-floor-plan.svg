  <text x='194' y='680' text-anchor='middle' font-size='12' fill='#666'>12' x 16'</text>
  <rect x='70' y='798' width='70' height='10' fill='#b9c6e0'/>
  <rect x='250' y='548' width='74' height='70' fill='#ffffff' stroke='#1a1a1a' stroke-width='3'/>
  <text x='287' y='588' text-anchor='middle' font-size='10' fill='#777'>CLOSET</text>


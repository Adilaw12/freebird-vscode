  <text x='439' y='316' text-anchor='middle' font-size='11' fill='#666'>ROOM</text>
  <circle cx='405' cy='350' r='9' fill='none' stroke='#8aa' stroke-width='2'/>

  <!-- Living Room -->
  <rect x='518' y='94' width='300' height='276' fill='#fff8ec' stroke='#1a1a1a' stroke-width='5'/>

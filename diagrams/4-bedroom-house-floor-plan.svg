  <circle cx='680' cy='640' r='12' fill='none' stroke='#8aa' stroke-width='2'/>

  <!-- Linen -->
  <rect x='582' y='672' width='120' height='40' fill='#ffffff' stroke='#1a1a1a' stroke-width='3'/>
  <text x='642' y='697' text-anchor='middle' font-size='10' fill='#777'>LINEN</text>

  <!-- Bedroom 4 / Office -->
  <rect x='582' y='716' width='120' height='90' fill='#eef2fb' stroke='#1a1a1a' stroke-width='5'/>
  <text x='642' y='745' text-anchor='middle' font-size='11' font-weight='600' fill='#333'>BED 4 /</text>
  <text x='642' y='760' text-anchor='middle' font-size='11' font-weight='600' fill='#333'>OFFICE</text>

  <!-- Master Suite -->
  <rect x='706' y='548' width='394' height='258' fill='#f9eef0' stroke='#1a1a1a' stroke-width='5'/>
  <text x='852' y='650' text-anchor='middle' font-size='18' font-weight='600' fill='#333'>BEDROOM 1 (MASTER)</text>
  <text x='852' y='672' text-anchor='middle' font-size='12' fill='#666'>16' x 17'</text>
  <rect x='706' y='794' width='90' height='12' fill='#e0b9c4'/>

  <!-- divider between master bedroom and its closet/bath -->
  <line x1='984' y1='548' x2='984' y2='806' stroke='#1a1a1a' stroke-width='5'/>

  <!-- Walk-in closet -->
  <rect x='988' y='548' width='112' height='110' fill='#ffffff' stroke='#1a1a1a' stroke-width='3'/>
  <text x='1044' y='596' text-anchor='middle' font-size='11' font-weight='600' fill='#333'>WALK-IN</text>
  <text x='1044' y='610' text-anchor='middle' font-size='11' font-weight='600' fill='#333'>CLOSET</text>

  <!-- Master Bath -->
  <rect x='988' y='662' width='112' height='144' fill='#ffffff' stroke='#1a1a1a' stroke-width='3'/>
  <text x='1044' y='700' text-anchor='middle' font-size='12' font-weight='600' fill='#333'>MASTER</text>
  <text x='1044' y='715' text-anchor='middle' font-size='12' font-weight='600' fill='#333'>BATH</text>
  <rect x='994' y='670' width='50' height='22' fill='none' stroke='#8aa' stroke-width='2'/>
  <circle cx='1080' cy='700' r='10' fill='none' stroke='#8aa' stroke-width='2'/>
  <rect x='994' y='760' width='80' height='36' fill='none' stroke='#8aa' stroke-width='2'/>
  <text x='1034' y='782' text-anchor='middle' font-size='9' fill='#8aa'>tub/shower</text>

  <!-- North arrow -->
  <g transform='translate(1065,120)'>
    <circle r='28' fill='#ffffff' stroke='#999' stroke-width='1.5'/>
    <line x1='0' y1='18' x2='0' y2='-18' stroke='#333' stroke-width='2'/>
    <polygon points='0,-24 -7,-12 7,-12' fill='#333'/>
    <text x='0' y='-30' text-anchor='middle' font-size='12' fill='#333' font-weight='600'>N</text>
  </g>

  <!-- Scale -->
  <g transform='translate(70,830)'>
    <line x1='0' y1='0' x2='120' y2='0' stroke='#333' stroke-width='2'/>
    <line x1='0' y1='-5' x2='0' y2='5' stroke='#333' stroke-width='2'/>
    <line x1='120' y1='-5' x2='120' y2='5' stroke='#333' stroke-width='2'/>
    <text x='60' y='-10' text-anchor='middle' font-size='11' fill='#555'>10 ft</text>

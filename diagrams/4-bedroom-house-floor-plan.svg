  <text x='961' y='240' text-anchor='middle' font-size='12' fill='#666'>14' x 17'3"</text>
  <rect x='940' y='86' width='80' height='10' fill='#9ec5e8'/>

  <!-- Kitchen -->
  <rect x='822' y='374' width='278' height='170' fill='#f3f7ee' stroke='#1a1a1a' stroke-width='5'/>
  <text x='961' y='440' text-anchor='middle' font-size='18' font-weight='600' fill='#333'>KITCHEN</text>

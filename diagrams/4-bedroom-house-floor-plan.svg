  <rect x='826' y='378' width='20' height='120' fill='#d8cdb8'/>
  <rect x='826' y='378' width='150' height='20' fill='#d8cdb8'/>
  <rect x='1030' y='378' width='66' height='20' fill='#d8cdb8'/>


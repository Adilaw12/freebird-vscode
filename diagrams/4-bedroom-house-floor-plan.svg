<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 880' font-family='Helvetica, Arial, sans-serif'>
  <rect x='0' y='0' width='1200' height='880' fill='#fbfaf7'/>
  <text x='600' y='36' text-anchor='middle' font-size='26' font-weight='bold' fill='#222'>4-BEDROOM HOUSE — FLOOR PLAN</text>
  <text x='600' y='58' text-anchor='middle' font-size='13' fill='#666'>Single Story · Approx. 2,275 sq ft (65' x 45')</text>

  <rect x='60' y='90' width='1040' height='720' fill='#ffffff' stroke='#1a1a1a' stroke-width='8'/>

  <!-- Garage -->
  <rect x='64' y='94' width='300' height='276' fill='#eef0f2' stroke='#1a1a1a' stroke-width='5'/>
  <text x='214' y='225' text-anchor='middle' font-size='20' font-weight='600' fill='#333'>GARAGE</text>
  <text x='214' y='247' text-anchor='middle' font-size='12' fill='#666'>19'6" x 17'3"</text>
  <rect x='110' y='362' width='210' height='8' fill='#1a1a1a'/>

  <!-- Entry -->
  <rect x='364' y='94' width='150' height='150' fill='#ffffff' stroke='#1a1a1a' stroke-width='5'/>
  <text x='439' y='165' text-anchor='middle' font-size='16' font-weight='600' fill='#333'>ENTRY</text>
  <text x='439' y='183' text-anchor='middle' font-size='11' fill='#666'>FOYER</text>
  <path d='M 414 94 A 40 40 0 0 1 454 134' fill='none' stroke='#999' stroke-width='1.5'/>
  <line x1='414' y1='94' x2='414' y2='134' stroke='#1a1a1a' stroke-width='4'/>
  <text x='439' y='74' text-anchor='middle' font-size='11' fill='#888'>front door</text>


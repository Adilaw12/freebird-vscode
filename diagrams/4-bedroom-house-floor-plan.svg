  <text x='453' y='680' text-anchor='middle' font-size='12' fill='#666'>11'6" x 16'</text>
  <rect x='500' y='548' width='74' height='70' fill='#ffffff' stroke='#1a1a1a' stroke-width='3'/>
  <text x='537' y='588' text-anchor='middle' font-size='10' fill='#777'>CLOSET</text>

  <!-- Bath 2 -->
  <rect x='582' y='548' width='120' height='120' fill='#ffffff' stroke='#1a1a1a' stroke-width='5'/>
